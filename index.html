<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030305" />
    <meta name="color-scheme" content="dark" />

    <!-- Fonts: connect early and load in parallel with the app (not via a CSS @import chain).
         Variable-weight files: one download per family covers every weight the site uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Outfit:wght@500..900&display=swap"
    />

    <!-- Primary Meta Tags -->
    <title>Exatech IT Solutions | Premium Web, Mobile & ERP Engineering</title>
    <meta name="title" content="Exatech IT Solutions | Premium Web, Mobile & ERP Engineering" />
    <meta name="description" content="A premium technology collective pioneering web development, AI capabilities, intelligent scalable ERP, and custom business automation frameworks." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://exatech.co.in/" />
    <meta property="og:title" content="Exatech IT Solutions | Premium Web, Mobile & ERP Engineering" />
    <meta property="og:description" content="A premium technology collective pioneering web development, AI capabilities, intelligent scalable ERP, and custom business automation frameworks." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://exatech.co.in/" />
    <meta property="twitter:title" content="Exatech IT Solutions | Premium Web, Mobile & ERP Engineering" />
    <meta property="twitter:description" content="A premium technology collective pioneering web development, AI capabilities, intelligent scalable ERP, and custom business automation frameworks." />
    <meta property="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
